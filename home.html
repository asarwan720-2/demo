<script>

/* =====================================================
   LOGIN CHECK
===================================================== */

const user =
  JSON.parse(
    localStorage.getItem("user")
  );


if(!user){

  window.location.href =
    "index.html";

}


/* =====================================================
   SUPABASE CLIENT
=====================================================

   Supabase connection यहां नहीं बनाया गया है.

   यह केवल आपके supabase.js से client लेगा.
===================================================== */

const db =
  window.client ||
  window.supabaseClient ||
  window.sb;


/* =====================================================
   SHOW USER ID
===================================================== */

function showUserId(){

  if(!user){

    return;

  }


  const id =
    user.id ||
    user.user_id ||
    user.mobile ||
    "0000";


  document.getElementById(
    "userId"
  ).innerText =
    "ID: " + id;

}


/* =====================================================
   WALLET
===================================================== */

async function updateWallet(){

  try{


    /*
       सबसे पहले wallet.js का
       loadWallet() इस्तेमाल होगा.
    */

    if(
      typeof window.loadWallet ===
      "function"
    ){

      await window.loadWallet();

      return;

    }


    /*
       अगर wallet.js में loadWallet()
       नहीं है तो यहां कोई Supabase
       connection create नहीं होगा.

       इसलिए HTML में key नहीं रखी गई.
    */

    if(!db){

      console.log(
        "wallet.js / supabase.js client नहीं मिला."
      );

      return;

    }


    if(
      !user ||
      !user.id
    ){

      return;

    }


    const {
      data,
      error
    } =
      await db
        .from("login")
        .select("balance")
        .eq("id",user.id)
        .single();


    if(error){

      console.log(
        "Wallet error:",
        error.message
      );

      return;

    }


    if(data){

      document.getElementById(
        "wallet"
      ).innerHTML =

        '<span style="font-size:27px;">🎧</span><br>₹ ' +

        (
          data.balance || 0
        );

    }


  }catch(error){

    console.log(
      "Wallet error:",
      error
    );

  }

}


/* =====================================================
   MARKET TIME CHECK
===================================================== */

function checkStatus(
  openTime,
  closeTime
){

  if(
    !openTime ||
    !closeTime
  ){

    return false;

  }


  const now =
    new Date();


  const openParts =
    String(openTime).split(":");


  const closeParts =
    String(closeTime).split(":");


  let open =
    new Date();


  open.setHours(
    Number(openParts[0]),
    Number(openParts[1]),
    0,
    0
  );


  let close =
    new Date();


  close.setHours(
    Number(closeParts[0]),
    Number(closeParts[1]),
    0,
    0
  );


  /*
     Overnight market
  */

  if(close < open){

    close.setDate(
      close.getDate() + 1
    );


    if(now < open){

      now.setDate(
        now.getDate() + 1
      );

    }

  }


  return(
    now >= open &&
    now <= close
  );

}


/* =====================================================
   LOAD MARKETS FROM GAME RESULT
===================================================== */

async function loadMarkets(){

  const container =
    document.getElementById(
      "container"
    );


  if(!db){

    container.innerHTML = `

      <div class="errorBox">

        Supabase client नहीं मिला।

        <br><br>

        अपना supabase.js check करें।

      </div>

    `;

    return;

  }


  try{


    const {
      data,
      error
    } =
      await db
        .from("Game result")
        .select(
          "name, number, open, close"
        );


    if(error){

      console.log(
        "Market error:",
        error
      );


      container.innerHTML = `

        <div class="errorBox">

          Market data load नहीं हो रहा।

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      container.innerHTML = `

        <div class="loading">

          अभी कोई market उपलब्ध नहीं है।

        </div>

      `;

      return;

    }


    /*
       OPEN market पहले
       CLOSED market बाद में
    */

    data.sort(
      (a,b)=>{

        return(

          checkStatus(
            b.open,
            b.close
          )

          -

          checkStatus(
            a.open,
            a.close
          )

        );

      }
    );


    container.innerHTML =
      "";


    data.forEach(
      item=>{


        const isOpen =
          checkStatus(
            item.open,
            item.close
          );


        const box =
          document.createElement(
            "div"
          );


        box.className =
          isOpen
            ? "marketBox openMarket"
            : "marketBox closedMarket";


        box.innerHTML = `

          <div class="marketName">

            ${escapeHTML(
              item.name || "Market"
            )}

          </div>


          <div class="marketNumber">

            ${escapeHTML(
              item.number || "**"
            )}

          </div>


          <div class="marketTime">

            ${escapeHTML(
              item.open || "--"
            )}

            -

            ${escapeHTML(
              item.close || "--"
            )}

          </div>


          <div class="marketStatus ${
            isOpen
              ? "open"
              : "closed"
          }">

            ${
              isOpen
                ? "● OPEN"
                : "● CLOSED"
            }

          </div>

        `;


        /*
           केवल OPEN market पर
           game.html खुलेगा.
        */

        if(isOpen){

          box.onclick =
            function(){

              localStorage.setItem(
                "market",
                item.name
              );


              window.location.href =
                "game.html";

            };

        }


        container.appendChild(
          box
        );


      }
    );


  }catch(error){


    console.log(
      "Market error:",
      error
    );


    container.innerHTML = `

      <div class="errorBox">

        Market load करने में समस्या हुई।

      </div>

    `;

  }

}


/* =====================================================
   HTML SAFE TEXT
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

    ){

        text:

    }else{

      );

    }


  }catch(error){

    );

  }

}


/* =====================================================
   START
===================================================== */

showUserId();

loadMarkets();

updateWallet();


/* =====================================================

===================================================== */
