<script>

/* =====================================================
   LOGIN CHECK
===================================================== */

const homeUser =
  JSON.parse(
    localStorage.getItem("user")
  );


if(!homeUser){

  window.location.href =
    "index.html";

}


/* =====================================================
   SUPABASE
=====================================================

   IMPORTANT:
   Supabase connection यहां नहीं बनाया गया।

   आपका supabase.js:

   const supabaseClient =
       supabase.createClient(...);

   उसी supabaseClient का इस्तेमाल होगा।
===================================================== */


/* =====================================================
   MARKET TIME CHECK
===================================================== */

function checkMarketStatus(
  openTime,
  closeTime
){

  if(
    !openTime ||
    !closeTime
  ){

    return false;

  }


  const now =
    new Date();


  const openParts =
    String(openTime)
      .split(":");


  const closeParts =
    String(closeTime)
      .split(":");


  let open =
    new Date();


  open.setHours(
    Number(openParts[0]),
    Number(openParts[1]),
    0,
    0
  );


  let close =
    new Date();


  close.setHours(
    Number(closeParts[0]),
    Number(closeParts[1]),
    0,
    0
  );


  /*
     अगर close अगली तारीख को है
  */

  if(close < open){

    close.setDate(
      close.getDate() + 1
    );


    if(now < open){

      now.setDate(
        now.getDate() + 1
      );

    }

  }


  return(
    now >= open &&
    now <= close
  );

}


/* =====================================================
   LOAD MARKETS
===================================================== */

async function loadMarkets(){

  const container =
    document.getElementById(
      "container"
    );


  try{


    const {
      data,
      error
    } =
      await supabaseClient

        .from("Game result")

        .select(
          "name,number,open,close"
        );


    if(error){

      console.error(
        "Market error:",
        error.message
      );


      container.innerHTML = `

        <div class="errorBox">

          Market load नहीं हुआ।

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      container.innerHTML = `

        <div class="loading">

          अभी कोई market उपलब्ध नहीं है।

        </div>

      `;

      return;

    }


    /*
       OPEN market पहले
    */

    data.sort(
      (a,b)=>{

        return(

          Number(
            checkMarketStatus(
              b.open,
              b.close
            )
          )

          -

          Number(
            checkMarketStatus(
              a.open,
              a.close
            )
          )

        );

      }
    );


    container.innerHTML =
      "";


    data.forEach(
      item=>{


        const isOpen =
          checkMarketStatus(
            item.open,
            item.close
          );


        const box =
          document.createElement(
            "div"
          );


        box.className =
          isOpen
            ? "marketBox"
            : "marketBox marketClosedBox";


        box.innerHTML = `

          <div class="marketName">

            ${escapeHTML(
              item.name || "Market"
            )}

          </div>


          <div class="marketNumber">

            ${escapeHTML(
              item.number || "**"
            )}

          </div>


          <div class="marketTime">

            ${escapeHTML(
              item.open || "--"
            )}

            -

            ${escapeHTML(
              item.close || "--"
            )}

          </div>


          <div class="marketStatus ${
            isOpen
              ? "marketOpen"
              : "marketClosed"
          }">

            ${
              isOpen
                ? "● OPEN"
                : "● CLOSED"
            }

          </div>

        `;


        /*
           केवल status/display रखा गया है।
        */


        container.appendChild(
          box
        );


      }
    );


  }catch(error){

    console.error(
      "Market loading failed:",
      error
    );


    container.innerHTML = `

      <div class="errorBox">

        Market load करने में समस्या हुई।

      </div>

    `;

  }

}


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

    ){

      await navigator.share({

        title:

        text:
          "Join now",

        url:

      });

    }else{

      );

    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }

}


/* =====================================================
   START MARKET SYSTEM
===================================================== */

loadMarkets();
